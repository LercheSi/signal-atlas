[project]
name = "signal-atlas-inventory"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.15"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]
